name: Run Tests and Upload Allure Results

on:
  push:
    branches: [ "master", "main", "Dashboard_Creation" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Run tests
      run: mvn clean test
      continue-on-error: true # Ensure results are uploaded even if tests fail

    - name: Upload Allure Results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: allure-results-ui-project # Unique artifact name for this project
        path: target/allure-results
        retention-days: 10
